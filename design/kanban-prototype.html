<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban — Prototype</title>
<style>
  :root {
    --surface-100: #f6f8f7;
    --surface-200: #ffffff;
    --ink: #16241f;
    --ink-muted: #5c6b65;
    --border: #dce3df;
    --brand: #2b5748;
    --brand-strong: #1e3f34;
    --accent: #c98a2b;
    --danger: #c23b3b;
    --ring: #2f6fed;

    --label-green-bg: #dcefe3;    --label-green-text: #1f6b45;
    --label-yellow-bg: #fbefc7;   --label-yellow-text: #8a6512;
    --label-orange-bg: #fbe4d2;   --label-orange-text: #9a4a14;
    --label-red-bg: #f6dada;      --label-red-text: #9a2f2f;
    --label-purple-bg: #e8dff5;   --label-purple-text: #5b3a9e;
    --label-blue-bg: #dce7fb;     --label-blue-text: #2452a8;

    --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
    --space-6: 24px; --space-8: 32px; --space-12: 48px;

    --radius-sm: 6px; --radius-md: 12px; --radius-lg: 20px; --radius-full: 999px;

    --shadow-card: 0 1px 2px rgba(22,36,31,0.10);
    --shadow-dragging: 0 10px 24px rgba(22,36,31,0.20);
    --shadow-hover: 0 0 0 1px var(--border), 0 4px 12px rgba(22,36,31,0.10), 0 2px 4px rgba(22,36,31,0.06);
    --surface-hover: #f1f5f3;

    --sidebar-w: 264px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    position: relative;
    background: var(--surface-100);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 21px;
    overflow-x: hidden;
    min-height: 100vh;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--radius-sm); }

  .bg-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .22; will-change: transform; }
  .bg-glow.g1 { width: 520px; height: 520px; top: -160px; right: -120px; background: var(--brand);  animation: drift-a 34s ease-in-out infinite; }
  .bg-glow.g2 { width: 420px; height: 420px; bottom: -180px; left: -100px; background: var(--accent); animation: drift-b 40s ease-in-out infinite; }
  .bg-lines { position: absolute; inset: 0; width: 100%; height: 100%; stroke: var(--ink-muted); fill: none; opacity: .22; }
  .bg-lines path { animation: doodle-drift 50s ease-in-out infinite; transform-origin: center; }
  .bg-lines path:nth-child(2) { animation-duration: 64s; animation-direction: reverse; }
  .bg-lines path:nth-child(3) { animation-duration: 46s; animation-delay: -12s; }
  @keyframes drift-a { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,50px) scale(1.12); } }
  @keyframes drift-b { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,-40px) scale(1.1); } }
  @keyframes doodle-drift { 0%, 100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(14px,-10px) rotate(0.8deg); } }
  @media (prefers-reduced-motion: reduce) { .bg-glow, .bg-lines path { animation: none; } }

  .app-shell { position: relative; z-index: 1; display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-right: 1px solid var(--border);
    padding: var(--space-6) var(--space-4);
    display: flex; flex-direction: column; gap: var(--space-6);
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 40;
    transform: translateX(-100%);
    transition: transform 220ms cubic-bezier(.2,.8,.2,1);
    overflow-y: auto;
  }
  .sidebar.open { transform: translateX(0); }
  @media (min-width: 960px) {
    .sidebar { position: static; transform: none; }
  }

  .sidebar-scrim {
    position: fixed; inset: 0; background: rgba(22,36,31,0.35); z-index: 35;
    opacity: 0; pointer-events: none; transition: opacity 200ms ease;
  }
  .sidebar-scrim.open { opacity: 1; pointer-events: auto; }
  @media (min-width: 960px) { .sidebar-scrim { display: none; } }

  .sidebar-brand { display: flex; align-items: center; gap: var(--space-3); }
  .brand-mark {
    width: 36px; height: 36px; border-radius: var(--radius-md);
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { font-size: 15px; font-weight: 700; line-height: 19px; }
  .brand-sub { font-size: 12px; color: var(--ink-muted); line-height: 16px; }

  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: var(--space-3);
    background: transparent; border: none; border-radius: var(--radius-sm);
    padding: var(--space-2); cursor: pointer; text-align: left; width: 100%;
    color: var(--ink-muted); font-size: 14px; font-weight: 500;
    transition: background .15s ease, color .15s ease;
  }
  .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
  .nav-item:hover { background: var(--surface-100); color: var(--ink); }
  .nav-item .nav-label { flex: 1; }
  .nav-badge {
    display: none; align-items: center; justify-content: center; min-width: 17px; height: 17px;
    padding: 0 4px; border-radius: var(--radius-full); background: var(--danger); color: #fff;
    font-size: 10px; font-weight: 700;
  }

  .sidebar-section { display: flex; flex-direction: column; gap: var(--space-1); }
  .sidebar-section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--space-2); font-size: 12px; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; color: var(--ink-muted);
  }
  .sidebar-add {
    width: 18px; height: 18px; border-radius: var(--radius-sm); border: none; background: transparent;
    color: var(--ink-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .sidebar-add:hover { background: var(--surface-100); color: var(--ink); }
  .sidebar-add svg { width: 13px; height: 13px; }

  .board-item {
    display: block; width: 100%; text-align: left; background: transparent; border: none;
    border-radius: var(--radius-sm); padding: var(--space-2); font-size: 14px; color: var(--ink-muted);
    cursor: pointer; transition: background .15s ease, color .15s ease;
  }
  .board-item:hover { background: var(--surface-100); color: var(--ink); }
  .board-item.active { background: var(--surface-100); color: var(--ink); font-weight: 600; }

  .sidebar-add-new {
    display: flex; align-items: center; gap: var(--space-2); background: transparent; border: none;
    padding: var(--space-2); font-size: 13px; color: var(--ink-muted); cursor: pointer; border-radius: var(--radius-sm);
  }
  .sidebar-add-new:hover { background: var(--surface-100); color: var(--ink); }
  .sidebar-add-new svg { width: 14px; height: 14px; }

  .sidebar-footer { margin-top: auto; padding-top: var(--space-4); border-top: 1px solid var(--border); }
  .profile-row { display: flex; align-items: center; gap: var(--space-2); }
  .profile-name { font-size: 13px; font-weight: 600; }
  .profile-role { font-size: 12px; color: var(--ink-muted); }

  .team-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .team-member { display: flex; align-items: center; gap: var(--space-2); }
  .team-member .avatar { width: 28px; height: 28px; font-size: 11px; flex-shrink: 0; }
  .team-member-info { min-width: 0; }
  .team-member-name { font-size: 13px; font-weight: 600; line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team-member-status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-muted); white-space: nowrap; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #3fb374; flex-shrink: 0; }

  .time-widget {
    background: var(--surface-100); border-radius: var(--radius-md); padding: var(--space-3);
    display: flex; flex-direction: column; gap: 2px;
  }
  .time-widget-label { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
  .time-widget-value { font-size: 20px; font-weight: 700; }
  .time-widget-trend { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #1f6b45; font-weight: 600; }
  .time-widget-trend svg { width: 12px; height: 12px; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .board-header {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: var(--space-3);
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(10px);
  }
  @media (min-width: 720px) { .board-header { padding: var(--space-4) var(--space-8); } }

  .sidebar-toggle {
    background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm);
    width: 36px; height: 36px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-muted);
  }
  .sidebar-toggle:hover { background: var(--surface-100); color: var(--ink); }
  .sidebar-toggle svg { width: 18px; height: 18px; }
  @media (min-width: 960px) { .sidebar-toggle { display: none; } }

  .header-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }

  .search-row .search-input { flex: 1; min-width: 160px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface-200); color: var(--ink-muted); display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; flex-shrink: 0; transition: background .15s ease, color .15s ease;
  }
  .icon-btn:hover { background: var(--surface-100); color: var(--ink); }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn-badge {
    position: absolute; top: -2px; right: -2px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--danger); border: 2px solid var(--surface-200); display: none;
  }
  .icon-btn-badge.show { display: block; }

  .user-chip { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
  .user-chip-name { font-size: 13px; font-weight: 600; white-space: nowrap; }

  .board-icon {
    width: 30px; height: 30px; border-radius: var(--radius-sm); background: var(--label-blue-bg); color: var(--label-blue-text);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .board-icon svg { width: 16px; height: 16px; }
  .progress-row h1 { font-size: 20px; line-height: 26px; font-weight: 600; margin: 0; flex-shrink: 0; }
  .board-progress-track { flex: 1; min-width: 80px; height: 6px; border-radius: var(--radius-full); background: var(--surface-100); overflow: hidden; }
  .board-progress-fill { height: 100%; border-radius: var(--radius-full); background: var(--brand); transition: width 200ms ease; width: 0%; }
  .board-progress-pct { font-size: 13px; color: var(--ink-muted); font-weight: 500; white-space: nowrap; flex-shrink: 0; }

  .tab-row { justify-content: space-between; }
  .tabs { display: flex; gap: var(--space-1); }
  .tab-btn {
    background: transparent; border: none; cursor: pointer; padding: var(--space-2) var(--space-1);
    font-size: 14px; font-weight: 500; color: var(--ink-muted); border-bottom: 2px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--brand-strong); border-color: var(--brand); font-weight: 600; }

  .header-people { display: flex; align-items: center; gap: var(--space-3); flex-shrink: 0; }
  .avatar-stack { display: flex; align-items: center; }
  .avatar-stack .avatar { margin-left: -8px; border: 2px solid var(--surface-200); }
  .avatar-stack .avatar:first-child { margin-left: 0; }
  .avatar-overflow { background: var(--surface-100) !important; color: var(--ink-muted) !important; }
  .invite-btn {
    background: var(--brand); color: #fff; border: none; border-radius: var(--radius-full);
    padding: var(--space-1) var(--space-4); font-size: 13px; font-weight: 600; cursor: pointer;
    white-space: nowrap; transition: background .15s ease;
  }
  .invite-btn:hover { background: var(--brand-strong); }

  .search-input { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); background: var(--surface-200); min-width: 180px; }
  .filter-chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; cursor: pointer; border-radius: var(--radius-full);
    padding: var(--space-1) var(--space-3); font-size: 13px; line-height: 18px; font-weight: 600;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
  }
  .chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; background: currentColor; }
  .chip:hover { transform: translateY(-1px); box-shadow: var(--shadow-card); }
  .chip.active { color: #fff; }
  .chip-green  { background: var(--label-green-bg);  color: var(--label-green-text); }
  .chip-orange { background: var(--label-orange-bg); color: var(--label-orange-text); }
  .chip-red    { background: var(--label-red-bg);    color: var(--label-red-text); }
  .chip-purple { background: var(--label-purple-bg); color: var(--label-purple-text); }
  .chip-blue   { background: var(--label-blue-bg);   color: var(--label-blue-text); }
  .chip-green.active  { background: var(--label-green-text); }
  .chip-orange.active { background: var(--label-orange-text); }
  .chip-red.active    { background: var(--label-red-text); }
  .chip-purple.active { background: var(--label-purple-text); }
  .chip-blue.active   { background: var(--label-blue-text); }

  .board { position: relative; z-index: 1; display: flex; gap: var(--space-6); padding: var(--space-8); overflow-x: auto; align-items: flex-start; background: transparent; }

  .list {
    flex: 0 0 280px;
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    background: rgba(241, 244, 243, 0.7);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .list-header { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-2); }
  .list-header h2 { font-size: 16px; line-height: 22px; font-weight: 600; margin: 0; }
  .count {
    font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted);
    background: var(--surface-100); border-radius: var(--radius-full); padding: 2px var(--space-2);
  }

  .list-accent { height: 3px; border-radius: var(--radius-full); margin: 0 var(--space-2); opacity: .8; }

  .cards { display: flex; flex-direction: column; gap: var(--space-4); min-height: 40px; border-radius: var(--radius-md); transition: background .15s ease; }
  .cards.drag-over { background: rgba(43,87,72,0.06); }

  .card-placeholder {
    border: 2px dashed var(--brand);
    border-radius: 16px;
    background: rgba(43,87,72,0.08);
  }

  .card {
    background: var(--surface-200);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: var(--space-3) var(--space-4);
    cursor: grab;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    transition: transform 180ms cubic-bezier(.2,.8,.2,1),
                box-shadow 180ms cubic-bezier(.2,.8,.2,1),
                background 180ms ease,
                border-color 180ms ease;
  }
  .card:hover {
    transform: translateY(-2px);
    background: var(--surface-hover);
    box-shadow: var(--shadow-hover);
    border-color: transparent;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { display: none; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px) scale(.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card.card-enter { animation: cardIn 260ms cubic-bezier(.2,.8,.2,1); }

  .card-labels { display: flex; gap: var(--space-1); flex-wrap: wrap; }
  .label { font-size: 12px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; border-radius: var(--radius-sm); padding: 2px var(--space-2); display: inline-flex; align-items: center; gap: 5px; }
  .label i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .card-title { font-size: 15px; line-height: 21px; font-weight: 600; }
  .card-desc { font-size: 13px; line-height: 18px; color: var(--ink-muted); }

  .card-progress { display: flex; flex-direction: column; gap: 4px; }
  .card-progress-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink-muted); font-weight: 500; }
  .card-progress-row strong { color: var(--ink); font-weight: 600; }
  .progress-track { height: 5px; border-radius: var(--radius-full); background: var(--surface-100); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: var(--radius-full); transition: width 200ms ease; }

  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding-top: var(--space-1); border-top: 1px solid var(--border); margin-top: 2px; }
  .card-meta-left { display: flex; align-items: center; gap: var(--space-3); font-size: 12px; color: var(--ink-muted); }
  .meta-item { display: inline-flex; align-items: center; gap: 4px; }
  .meta-item svg { width: 12px; height: 12px; }
  .meta-item.overdue { color: var(--danger); font-weight: 600; }
  .avatar {
    width: 22px; height: 22px; border-radius: var(--radius-full); background: var(--brand); color: #fff;
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .add-card {
    background: transparent; border: none; text-align: left; color: var(--ink-muted);
    padding: var(--space-2); border-radius: var(--radius-sm); cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .add-card:hover { background: rgba(255,255,255,0.6); color: var(--ink); }

  .dock {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
    display: flex; align-items: center; gap: var(--space-1);
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    padding: var(--space-1);
    box-shadow: var(--shadow-hover);
  }
  .dock-btn {
    position: relative;
    display: flex; align-items: center; gap: var(--space-1);
    background: transparent; border: none; border-radius: var(--radius-full);
    padding: var(--space-2) var(--space-4); cursor: pointer;
    color: var(--ink-muted); font-size: 13px; font-weight: 500;
    transition: background .15s ease, color .15s ease;
  }
  .dock-btn svg { width: 15px; height: 15px; }
  .dock-btn:hover { background: var(--surface-100); color: var(--ink); }
  .dock-btn.active { background: var(--brand); color: #fff; }
  .dock-badge {
    display: none; align-items: center; justify-content: center; min-width: 16px; height: 16px;
    padding: 0 4px; border-radius: var(--radius-full); background: var(--danger); color: #fff;
    font-size: 10px; font-weight: 700; margin-left: 2px;
  }

  .side-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 320px; max-width: 86vw;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(16px);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgba(22,36,31,0.08);
    transform: translateX(100%);
    transition: transform 240ms cubic-bezier(.2,.8,.2,1);
    z-index: 25;
    display: flex; flex-direction: column;
  }
  .side-panel.open { transform: translateX(0); }
  .side-panel-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4); border-bottom: 1px solid var(--border); }
  .side-panel-header h3 { margin: 0; font-size: 16px; }
  .side-panel-close { background: none; border: none; cursor: pointer; color: var(--ink-muted); padding: var(--space-1); border-radius: var(--radius-sm); display: flex; }
  .side-panel-close:hover { background: var(--surface-100); color: var(--ink); }
  .side-panel-close svg { width: 16px; height: 16px; }
  .side-panel-body { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
  .panel-item { display: flex; gap: var(--space-2); padding: var(--space-2); border-radius: var(--radius-sm); }
  .panel-item.unread { background: var(--label-blue-bg); }
  .panel-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ring); margin-top: 6px; flex-shrink: 0; }
  .panel-text { font-size: 13px; line-height: 18px; }
  .panel-time { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .panel-empty { color: var(--ink-muted); font-size: 13px; }

  .modal-overlay {
    position: fixed; inset: 0; z-index: 50; padding: var(--space-4);
    background: rgba(22,36,31,0.4);
    backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 180ms ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--surface-200);
    border-radius: var(--radius-lg);
    width: min(880px, 100%);
    max-height: min(640px, 90vh);
    display: flex;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(22,36,31,0.28);
    transform: scale(.96) translateY(8px);
    transition: transform 220ms cubic-bezier(.2,.8,.2,1);
  }
  .modal-overlay.open .modal { transform: scale(1) translateY(0); }
  .modal-close {
    position: absolute; top: var(--space-3); right: var(--space-3); z-index: 2;
    background: none; border: none; cursor: pointer; color: var(--ink-muted);
    padding: var(--space-1); border-radius: var(--radius-sm); display: flex;
  }
  .modal-close svg { width: 18px; height: 18px; }
  .modal-close:hover { background: var(--surface-100); color: var(--ink); }
  .modal-left { flex: 1.3; padding: var(--space-8) var(--space-6) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); overflow-y: auto; }
  .modal-right { flex: 1; min-width: 260px; border-left: 1px solid var(--border); background: var(--surface-100); padding: var(--space-6) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .modal-right h3 { margin: 0; font-size: 16px; }
  .modal-field { display: flex; flex-direction: column; gap: var(--space-1); font-size: 13px; color: var(--ink-muted); font-weight: 500; }
  .modal-field input, .modal-field textarea, .modal-field select {
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3);
    background: var(--surface-100); color: var(--ink); font-size: 14px; font-weight: 400; font-family: inherit; resize: vertical;
  }
  #modalTitle { font-size: 18px; font-weight: 600; }
  .modal-row { display: flex; gap: var(--space-4); }
  .modal-row .modal-field { flex: 1; }
  .modal-save {
    align-self: flex-start; background: var(--brand); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-4); cursor: pointer; font-weight: 600; font-size: 14px; transition: background .15s ease;
  }
  .modal-save:hover { background: var(--brand-strong); }
  .comment-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-3); }
  .comment-item { display: flex; gap: var(--space-2); }
  .comment-body { background: var(--surface-200); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); flex: 1; }
  .comment-meta { font-size: 12px; color: var(--ink-muted); display: flex; gap: var(--space-1); margin-bottom: 2px; }
  .comment-meta strong { color: var(--ink); }
  .comment-text { font-size: 13px; line-height: 18px; }
  .comment-empty { color: var(--ink-muted); font-size: 13px; }
  .comment-input-row { display: flex; gap: var(--space-2); }
  .comment-input-row input { flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); background: var(--surface-200); }
  .comment-input-row button { background: var(--brand); color: #fff; border: none; border-radius: var(--radius-sm); width: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .comment-input-row button svg { width: 15px; height: 15px; }

  @media (max-width: 720px) {
    .modal { flex-direction: column; max-height: 92vh; }
    .modal-right { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

    <div class="sidebar-section">

<script>
  const CATEGORIES = {
    design:   { name: "Design",   bg: "var(--label-green-bg)",  color: "var(--label-green-text)" },
    dev:      { name: "Dev",      bg: "var(--label-blue-bg)",   color: "var(--label-blue-text)" },
    bug:      { name: "Bug",      bg: "var(--label-red-bg)",    color: "var(--label-red-text)" },
    research: { name: "Research", bg: "var(--label-purple-bg)", color: "var(--label-purple-text)" },
  };
  const PRIORITIES = {
    low:    { name: "Low",    bg: "var(--label-green-bg)",  color: "var(--label-green-text)" },
    medium: { name: "Medium", bg: "var(--label-orange-bg)", color: "var(--label-orange-text)" },
    high:   { name: "High",   bg: "var(--label-red-bg)",    color: "var(--label-red-text)" },
  };
  const LIST_ACCENTS = {
    todo: "var(--label-orange-text)",
    doing: "var(--label-blue-text)",
    done: "var(--label-green-text)",
  };
  const ICONS = {
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    comment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-3.8 7.1 8.5 8.5 0 0 1-9.8-.3L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>',
    clip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.2a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>',
  };
  function icon(name) { return ICONS[name] || ""; }
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  let data = [
    { id: "todo", title: "To do", cards: [
      { id: "c1", title: "Sketch the label-filter panel", desc: "Figure out chip layout and active states.", category: "research", priority: "medium", due: "Nov 18", overdue: false, progress: 2, views: 14, comments: [
        { who: "MI", text: "Started exploring chip shapes — pill with a leading dot reads clearer than a solid block.", time: "Nov 12" },
      ], attachments: 1, who: "MI" },
      { id: "c2", title: "Write onboarding empty-state copy", desc: "Copy for a board with zero cards yet.", category: "design", priority: "low", due: "Nov 20", overdue: false, progress: 0, views: 5, comments: [], attachments: 0, who: "MI" },
    ]},
    { id: "doing", title: "In progress", cards: [
      { id: "c3", title: "Build drag-and-drop between lists", desc: "Native HTML5 DnD with live reorder.", category: "dev", priority: "high", due: "Nov 14", overdue: true, progress: 6, views: 32, comments: [
        { who: "MI", text: "Cross-column drop below a card was buggy — switching to a placeholder element instead of moving the live node.", time: "Nov 15" },
      ], attachments: 2, who: "MI" },
      { id: "c4", title: "Wire up search across card titles", desc: "Match on title only for now.", category: "dev", priority: "medium", due: "Nov 21", overdue: false, progress: 3, views: 9, comments: [], attachments: 0, who: "MI" },
    ]},
    { id: "done", title: "Done", cards: [
      { id: "c5", title: "Pick the base palette", desc: "Teal-leaning green so it stays distinct from the danger red.", category: "design", priority: "low", due: null, overdue: false, progress: 10, views: 21, comments: [
        { who: "MI", text: "Locked in #2b5748 as the brand color.", time: "Nov 10" },
      ], attachments: 0, who: "MI" },
    ]},
  ];

  const cardsById = new Map();
  data.forEach(list => list.cards.forEach(c => cardsById.set(c.id, c)));

  function findListOfCard(id) {
    return data.find(l => l.cards.some(c => c.id === id));
  }

  let activeFilters = new Set();
  let searchTerm = "";

  const board = document.getElementById("board");

  function cardMatches(card) {
    const matchesFilter = activeFilters.size === 0 || (card.category && activeFilters.has(card.category));
    const matchesSearch = card.title.toLowerCase().includes(searchTerm.toLowerCase());
    return matchesFilter && matchesSearch;
  }

  function computeBoardProgress() {
    const allCards = data.flatMap(l => l.cards);
    if (!allCards.length) return 0;
    const sum = allCards.reduce((acc, c) => acc + (c.progress || 0), 0);
    return Math.round((sum / (allCards.length * 10)) * 100);
  }

  function render() {
    board.innerHTML = "";
    const pct = computeBoardProgress();
    const fillEl = document.getElementById("boardProgressFill");
    const pctEl = document.getElementById("boardProgressPct");
    if (fillEl) fillEl.style.width = pct + "%";
    if (pctEl) pctEl.textContent = pct + "% complete";
    data.forEach(list => {
      const visibleCards = list.cards.filter(cardMatches);
      const accent = LIST_ACCENTS[list.id] || "var(--brand)";

      const section = document.createElement("section");
      section.className = "list";
      section.dataset.listId = list.id;

      section.innerHTML = `
        <header class="list-header">
          <h2>${list.title}</h2>
          <span class="count">${visibleCards.length}</span>
        </header>
        <div class="list-accent" style="background:${accent}"></div>
        <div class="cards" data-dropzone></div>
        <button class="add-card" type="button">+ Add a card</button>
      `;

      const dropzone = section.querySelector(".cards");
      visibleCards.forEach(card => dropzone.appendChild(renderCard(card, list)));

      section.querySelector(".add-card").addEventListener("click", () => {
        const card = { id: "c" + Date.now(), title: "Untitled card", desc: "", category: null, priority: null, due: null, overdue: false, progress: 0, views: 0, comments: [], attachments: 0, who: "MI", _isNew: true };
        list.cards.push(card);
        cardsById.set(card.id, card);
        if (!cardMatches(card)) { render(); return; }
        const el = renderCard(card, list, { enter: true });
        dropzone.appendChild(el);
        section.querySelector(".count").textContent = dropzone.querySelectorAll(".card").length;
        openModal(card);
      });

      board.appendChild(section);
    });
  }

  function renderCard(card, list, { enter = false } = {}) {
    const el = document.createElement("div");
    el.className = "card" + (enter ? " card-enter" : "");
    el.draggable = true;
    el.dataset.cardId = card.id;

    const cat = card.category && CATEGORIES[card.category];
    const pri = card.priority && PRIORITIES[card.priority];
    const accent = LIST_ACCENTS[list.id] || "var(--brand)";

    const catHtml = cat ? `<span class="label" style="background:${cat.bg};color:${cat.color}"><i style="background:${cat.color}"></i>${cat.name}</span>` : "";
    const priHtml = pri ? `<span class="label" style="background:${pri.bg};color:${pri.color}">${pri.name}</span>` : "";

    const progressHtml = card.progress != null
      ? `<div class="card-progress">
           <div class="card-progress-row"><span>Progress</span><strong>${card.progress}/10</strong></div>
           <div class="progress-track"><div class="progress-fill" style="width:${card.progress * 10}%;background:${accent}"></div></div>
         </div>`
      : "";

    const viewsHtml = card.views ? `<span class="meta-item">${icon("eye")}${card.views}</span>` : "";
    const dueHtml = card.due
      ? `<span class="meta-item${card.overdue ? " overdue" : ""}">${icon("calendar")}${card.overdue ? "Overdue · " : ""}${escapeHtml(card.due)}</span>`
      : "";
    const commentsHtml = card.comments.length ? `<span class="meta-item">${icon("comment")}${card.comments.length}</span>` : "";
    const attachHtml = card.attachments ? `<span class="meta-item">${icon("clip")}${card.attachments}</span>` : "";

    el.innerHTML = `
      <div class="card-labels">${catHtml}${priHtml}</div>
      <div class="card-title">${escapeHtml(card.title)}</div>
      ${card.desc ? `<div class="card-desc">${escapeHtml(card.desc)}</div>` : ""}
      ${progressHtml}
      <div class="card-footer">
        <div class="card-meta-left">${viewsHtml}${commentsHtml}${dueHtml}${attachHtml}</div>
        <span class="avatar">${escapeHtml(card.who)}</span>
      </div>
    `;

    el.addEventListener("animationend", () => el.classList.remove("card-enter"), { once: true });

    return el;
  }

  let draggedCard = null;
  let placeholder = null;
  let fromListId = null;
  let justDraggedRecently = false;

  function makePlaceholder(height) {
    const p = document.createElement("div");
    p.className = "card-placeholder";
    p.style.height = height + "px";
    return p;
  }

  function getDragAfterElement(container, y) {
    const els = [...container.querySelectorAll(".card:not(.dragging)")];
    return els.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset, element: child };
      }
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
  }

  function flipBoard(mutate) {
    const els = [...board.querySelectorAll(".card:not(.dragging), .card-placeholder")];
    const before = new Map(els.map(el => [el, el.getBoundingClientRect()]));
    mutate();
    requestAnimationFrame(() => {
      els.forEach(el => {
        if (!el.isConnected) return;
        const b = before.get(el);
        const a = el.getBoundingClientRect();
        const dx = b.left - a.left;
        const dy = b.top - a.top;
        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
        el.style.transition = "none";
        el.style.transform = `translate(${dx}px, ${dy}px)`;
        requestAnimationFrame(() => {
          el.style.transition = "transform 220ms cubic-bezier(.2,.8,.2,1)";
          el.style.transform = "";
        });
      });
    });
  }

  function syncDataFromDOM() {
    document.querySelectorAll(".list").forEach(section => {
      const list = data.find(l => l.id === section.dataset.listId);
      const ids = [...section.querySelectorAll(".card")].map(el => el.dataset.cardId);
      list.cards = ids.map(id => cardsById.get(id));
      section.querySelector(".count").textContent = list.cards.length;
    });
  }

  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    draggedCard = card;
    fromListId = card.closest(".list").dataset.listId;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", card.dataset.cardId);
    const rect = card.getBoundingClientRect();
    placeholder = makePlaceholder(rect.height);
    card.insertAdjacentElement("afterend", placeholder);
    requestAnimationFrame(() => card.classList.add("dragging"));
  });

  board.addEventListener("dragover", e => {
    const dropzone = e.target.closest("[data-dropzone]");
    if (!dropzone || !placeholder) return;
    e.preventDefault();

    document.querySelectorAll("[data-dropzone]").forEach(dz => dz.classList.toggle("drag-over", dz === dropzone));

    const afterElement = getDragAfterElement(dropzone, e.clientY);
    if (placeholder.parentElement === dropzone && placeholder.nextElementSibling === afterElement) return;

    flipBoard(() => {
      if (afterElement == null) dropzone.appendChild(placeholder);
      else dropzone.insertBefore(placeholder, afterElement);
    });
  });

  board.addEventListener("drop", e => {
    const dropzone = e.target.closest("[data-dropzone]");
    if (!dropzone) return;
    e.preventDefault();
  });

  board.addEventListener("dragend", () => {
    const movedCard = draggedCard;
    const prevFromListId = fromListId;

    if (movedCard && placeholder && placeholder.parentElement) {
      placeholder.replaceWith(movedCard);
    }
    if (movedCard) movedCard.classList.remove("dragging");
    if (placeholder) placeholder.remove();
    document.querySelectorAll("[data-dropzone]").forEach(dz => dz.classList.remove("drag-over"));

    placeholder = null;
    draggedCard = null;
    fromListId = null;

    if (!movedCard) return;
    syncDataFromDOM();

    const toListId = movedCard.closest(".list") && movedCard.closest(".list").dataset.listId;
    if (toListId && prevFromListId && toListId !== prevFromListId) {
      const card = cardsById.get(movedCard.dataset.cardId);
      const fromTitle = (data.find(l => l.id === prevFromListId) || {}).title || prevFromListId;
      const toTitle = (data.find(l => l.id === toListId) || {}).title || toListId;
      logActivity(`Moved "${card.title}" from ${fromTitle} to ${toTitle}`);
    }

    justDraggedRecently = true;
    setTimeout(() => { justDraggedRecently = false; }, 50);
  });

  board.addEventListener("click", e => {
    if (justDraggedRecently) return;
    const card = e.target.closest(".card");
    if (!card) return;
    const cardData = cardsById.get(card.dataset.cardId);
    if (cardData) openModal(cardData);
  });

  document.getElementById("search").addEventListener("input", e => {
    searchTerm = e.target.value;
    render();
  });

  document.getElementById("filters").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const label = chip.dataset.label;
    if (activeFilters.has(label)) {
      activeFilters.delete(label);
      chip.classList.remove("active");
    } else {
      activeFilters.add(label);
      chip.classList.add("active");
    }
    render();
  });

  let notifications = [
    { text: '"Build drag-and-drop between lists" is overdue', time: "2h ago", unread: true },
    { text: "MI commented on \"Pick the base palette\"", time: "1d ago", unread: true },
    { text: '"Wire up search across card titles" was assigned to you', time: "2d ago", unread: false },
  ];
  let activityLog = [
    { text: 'Added "Pick the base palette" to Done', time: "Nov 10" },
    { text: 'Moved "Build drag-and-drop between lists" to In progress', time: "Nov 13" },
  ];
  let sidePanelMode = null;

  function updateInboxBadge() {
    const unread = notifications.filter(n => n.unread).length;
    [document.getElementById("inboxBadge"), document.getElementById("navBadge")].forEach(badge => {
      if (!badge) return;
      badge.textContent = unread;
      badge.style.display = unread > 0 ? "inline-flex" : "none";
    });
    const bellBadge = document.getElementById("headerBellBadge");
    if (bellBadge) bellBadge.classList.toggle("show", unread > 0);
  }

  function renderSidePanel() {
    const titleEl = document.getElementById("sidePanelTitle");
    const bodyEl = document.getElementById("sidePanelBody");
    if (sidePanelMode === "inbox") {
      titleEl.textContent = "Inbox";
      bodyEl.innerHTML = notifications.length
        ? notifications.map(n => `
            <div class="panel-item${n.unread ? " unread" : ""}">
              <span class="panel-dot"></span>
              <div>
                <div class="panel-text">${escapeHtml(n.text)}</div>
                <div class="panel-time">${escapeHtml(n.time)}</div>
              </div>
            </div>
          `).join("")
        : `<p class="panel-empty">You're all caught up.</p>`;
    } else if (sidePanelMode === "activity") {
      titleEl.textContent = "Activity";
      bodyEl.innerHTML = activityLog.length
        ? activityLog.map(a => `
            <div class="panel-item">
              <div>
                <div class="panel-text">${escapeHtml(a.text)}</div>
                <div class="panel-time">${escapeHtml(a.time)}</div>
              </div>
            </div>
          `).join("")
        : `<p class="panel-empty">No activity yet.</p>`;
    }
  }

  function logActivity(text) {
    activityLog.unshift({ text, time: "Just now" });
    if (sidePanelMode === "activity") renderSidePanel();
  }

  function toggleSidePanel(mode) {
    const panel = document.getElementById("sidePanel");
    if (sidePanelMode === mode && panel.classList.contains("open")) {
      panel.classList.remove("open");
      sidePanelMode = null;
    } else {
      sidePanelMode = mode;
      panel.classList.add("open");
      renderSidePanel();
    }
    document.querySelectorAll(".dock-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === sidePanelMode));
  }

  document.getElementById("dockInbox").addEventListener("click", () => toggleSidePanel("inbox"));
  document.getElementById("dockActivity").addEventListener("click", () => toggleSidePanel("activity"));
  document.getElementById("sidePanelClose").addEventListener("click", () => toggleSidePanel(sidePanelMode));

  document.getElementById("headerBell").addEventListener("click", () => toggleSidePanel("inbox"));
  document.getElementById("headerTabs").addEventListener("click", e => {
    const btn = e.target.closest(".tab-btn");
    if (!btn) return;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });

  const TEAM = [
    { initials: "AL", name: "Aria Lund" },
    { initials: "MR", name: "Marco Reyes" },
    { initials: "SK", name: "Sana Khatun" },
    { initials: "DC", name: "Devon Cole" },
  ];

  function renderTeamList() {
    const list = document.getElementById("teamList");
    if (!list) return;
    const time = new Date().toLocaleTimeString([], { hour12: false });
    list.innerHTML = TEAM.map(member => `
      <div class="team-member">
        <span class="avatar">${escapeHtml(member.initials)}</span>
        <div class="team-member-info">
          <div class="team-member-name">${escapeHtml(member.name)}</div>
          <div class="team-member-status"><span class="status-dot"></span>Online · ${time}</div>
        </div>
      </div>
    `).join("");
  }

  renderTeamList();
  setInterval(renderTeamList, 1000);

  const sidebarEl = document.getElementById("sidebar");
  const scrimEl = document.getElementById("sidebarScrim");

  function openSidebarNav() {
    sidebarEl.classList.add("open");
    scrimEl.classList.add("open");
  }
  function closeSidebarNav() {
    sidebarEl.classList.remove("open");
    scrimEl.classList.remove("open");
  }

  document.getElementById("sidebarToggle").addEventListener("click", () => {
    sidebarEl.classList.contains("open") ? closeSidebarNav() : openSidebarNav();
  });
  scrimEl.addEventListener("click", closeSidebarNav);

  document.getElementById("navActivity").addEventListener("click", () => {
    closeSidebarNav();
    toggleSidePanel("activity");
  });
  document.getElementById("navUpdates").addEventListener("click", () => {
    closeSidebarNav();
    toggleSidePanel("inbox");
  });
  document.getElementById("navSettings").addEventListener("click", closeSidebarNav);

  document.querySelectorAll(".board-item").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".board-item").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      closeSidebarNav();
    });
  });

  let currentCard = null;

  function openModal(card) {
    currentCard = card;
    document.getElementById("modalTitle").value = card.title;
    document.getElementById("modalDesc").value = card.desc || "";
    document.getElementById("modalCategory").value = card.category || "";
    document.getElementById("modalPriority").value = card.priority || "";
    document.getElementById("modalProgress").value = card.progress != null ? card.progress : 0;
    document.getElementById("modalDue").value = card.due || "";
    renderComments();
    document.getElementById("modalOverlay").classList.add("open");
    document.getElementById("modalTitle").focus();
    document.getElementById("modalTitle").select();
  }

  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("open");
    currentCard = null;
  }

  function renderComments() {
    const list = document.getElementById("commentList");
    if (!currentCard.comments.length) {
      list.innerHTML = `<p class="comment-empty">No comments yet.</p>`;
      return;
    }
    list.innerHTML = currentCard.comments.map(c => `
      <div class="comment-item">
        <span class="avatar">${escapeHtml(c.who)}</span>
        <div class="comment-body">
          <div class="comment-meta"><strong>${escapeHtml(c.who)}</strong><span>${escapeHtml(c.time)}</span></div>
          <div class="comment-text">${escapeHtml(c.text)}</div>
        </div>
      </div>
    `).join("");
    list.scrollTop = list.scrollHeight;
  }

  function addComment() {
    const input = document.getElementById("commentInput");
    const text = input.value.trim();
    if (!text || !currentCard) return;
    currentCard.comments.push({ who: "MI", text, time: "Just now" });
    input.value = "";
    renderComments();
    render();
  }

  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", e => {
    if (e.target.id === "modalOverlay") closeModal();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && document.getElementById("modalOverlay").classList.contains("open")) closeModal();
  });

  document.getElementById("modalSave").addEventListener("click", () => {
    if (!currentCard) return;
    currentCard.title = document.getElementById("modalTitle").value.trim() || currentCard.title;
    currentCard.desc = document.getElementById("modalDesc").value.trim();
    currentCard.category = document.getElementById("modalCategory").value || null;
    currentCard.priority = document.getElementById("modalPriority").value || null;
    currentCard.due = document.getElementById("modalDue").value.trim() || null;
    const rawProgress = parseInt(document.getElementById("modalProgress").value, 10);
    currentCard.progress = Math.max(0, Math.min(10, isNaN(rawProgress) ? 0 : rawProgress));

    if (currentCard._isNew) {
      delete currentCard._isNew;
      const list = findListOfCard(currentCard.id);
      logActivity(`Added "${currentCard.title}" to ${list ? list.title : ""}`);
    } else {
      logActivity(`Edited "${currentCard.title}"`);
    }

    render();
    closeModal();
  });

  document.getElementById("commentSend").addEventListener("click", addComment);
  document.getElementById("commentInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addComment();
  });

  updateInboxBadge();
  render();
</script>

</body>
</html>
